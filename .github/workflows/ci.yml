name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: rms
          POSTGRES_DB: rms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rms -d rms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      API_PORT: 3000
      WEB_PORT: 5173
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://rms:rms@localhost:5432/rms?schema=public
      DIRECT_URL: postgresql://rms:rms@localhost:5432/rms?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      EMAIL_SINK_PATH: ./.email-sink
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @rms/api

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Seed database
        run: npm run prisma:seed --workspace @rms/api

      - name: Build applications
        run: npm run build

      - name: Type-check workspaces
        run: npm run lint

      - name: Run API tests
        run: npm test --workspace @rms/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test --project=chromium
